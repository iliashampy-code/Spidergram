name: Build SpiderGram APK
on:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/build-apk.yml'
      - 'server.js'
      - 'download.html'
  workflow_dispatch:
permissions:
  contents: write
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - run: gradle -p android-app :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SpiderGram-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to SpiderGram server
        run: |
          mkdir -p downloads
          cp android-app/app/build/outputs/apk/debug/app-debug.apk downloads/SpiderGram.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/SpiderGram.apk
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "chore: publish SpiderGram APK"
            git push
          fi
