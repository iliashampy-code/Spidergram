name: Build SpiderGram VPN test APK

on:
  workflow_dispatch:
  push:
    branches: [vpn-test]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager"
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Inject private WireGuard config
        env:
          SPIDERGRAM_WG_CONFIG: ${{ secrets.SPIDERGRAM_WG_CONFIG }}
        run: |
          if [ -z "$SPIDERGRAM_WG_CONFIG" ]; then
            echo "Missing GitHub Actions secret SPIDERGRAM_WG_CONFIG"
            exit 1
          fi
          mkdir -p vpn-test/app/src/main/res/raw
          printf '%s\n' "$SPIDERGRAM_WG_CONFIG" > vpn-test/app/src/main/res/raw/spidergram.conf

      - name: Build debug APK
        working-directory: vpn-test
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: spidergram-vpn-test
          path: vpn-test/app/build/outputs/apk/debug/app-debug.apk
