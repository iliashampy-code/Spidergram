<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SpiderGram</title><script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
<style>
:root{--accent:#1688ff;--bg:#eef1f5;--panel:#fff;--text:#18212b;--muted:#7d8791;--line:#e7ebef;--input:#f0f3f6;--messages:#f6f8fa;--mine:#1688ff}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body.dark{--bg:#101317;--panel:#181c21;--text:#eef2f6;--muted:#9ca6b0;--line:#2a3037;--input:#22272e;--messages:#12161b}.app{width:100%;max-width:680px;height:100dvh;margin:auto;background:var(--panel);display:flex;flex-direction:column;overflow:hidden}.top{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--line);flex:none}.brand{font-size:21px;font-weight:800}.blue{color:var(--accent)}button,input{font:inherit}.icon,.back{border:0;background:transparent;color:inherit;font-size:23px;padding:8px}.content{flex:1;overflow:auto}.screen{padding:14px 16px}.search{background:var(--input);color:var(--text);border:0;border-radius:14px;padding:12px 15px;width:100%;outline:none}.chat{display:flex;align-items:center;gap:12px;padding:12px 3px;border-bottom:1px solid var(--line);cursor:pointer}.avatar{width:48px;height:48px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;flex:none;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.chattext{flex:1;min-width:0}.chatname{font-weight:700}.preview{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.time{font-size:12px;color:var(--muted)}.login{padding:30px 24px}.login h1{text-align:center;margin:20px 0 8px}.login p{text-align:center;color:var(--muted)}.field{width:100%;padding:14px;margin:6px 0;border:1px solid var(--line);background:var(--input);color:var(--text);border-radius:13px;outline:none}.primary{width:100%;padding:14px;margin:8px 0;border:0;border-radius:13px;background:var(--accent);color:#fff;font-weight:700}.ghost{width:100%;padding:13px;border:0;background:transparent;color:var(--accent)}.chathead{height:62px;display:flex;align-items:center;gap:10px;padding:7px 10px;border-bottom:1px solid var(--line);flex:none}.chathead .avatar{width:42px;height:42px}.status{font-size:12px;color:var(--muted)}.typing{color:var(--accent)}.messages{padding:14px 12px;overflow:auto;flex:1;background:var(--messages);background-size:cover;background-position:center}.bubble{max-width:82%;padding:9px 12px;margin:5px 0;border-radius:15px;background:var(--panel);box-shadow:0 1px 2px #00000012;word-break:break-word}.bubble.me{margin-left:auto;background:var(--mine);color:#fff}.bubble img{max-width:100%;max-height:300px;border-radius:11px;display:block}.bubble audio{max-width:100%;margin-top:3px}.bubble .meta{font-size:10px;opacity:.65;margin-top:4px}.composer{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line);background:var(--panel);align-items:center}.composer input{flex:1;border:0;background:var(--input);color:var(--text);border-radius:20px;padding:11px 14px;outline:0}.send,.round{border:0;background:var(--accent);color:#fff;border-radius:50%;width:42px;height:42px;flex:none}.round.recording{background:#e5484d}.mic-icon{font-size:19px;line-height:1}.voice-preview{display:flex;align-items:center;gap:8px;padding:8px;border-top:1px solid var(--line);background:var(--panel)}.voice-preview audio{flex:1;min-width:0}.voice-preview button{border:0;background:var(--input);color:var(--text);border-radius:12px;padding:9px 12px}.voice-preview .voice-send{background:var(--accent);color:#fff}.badge{background:var(--accent);color:#fff;border-radius:10px;padding:2px 7px;font-size:11px;margin-left:auto}.group-create{display:flex;gap:6px;margin:10px 0}.group-create input{flex:1;border:0;background:var(--input);color:var(--text);border-radius:12px;padding:10px}.empty{text-align:center;color:var(--muted);padding:40px 15px}.profile{padding:24px;text-align:center;overflow:auto}.bigavatar{width:96px;height:96px;margin:auto;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:30px;font-weight:800;overflow:hidden}.bigavatar img{width:100%;height:100%;object-fit:cover}.section{margin:18px 0;text-align:left}.section h3{font-size:13px;color:var(--muted);margin:0 0 8px}.setting{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line)}.setting input[type=color]{width:42px;height:34px;border:0;background:transparent}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:var(--input);color:var(--text);padding:9px 12px;border-radius:12px}.chip.active{border-color:var(--accent);outline:2px solid color-mix(in srgb,var(--accent) 25%,transparent)}.notice{font-size:12px;color:var(--muted);text-align:left;margin-top:10px}.hidden{display:none!important}.passwrap{position:relative}.passwrap .field{padding-right:48px}.msg-actions{display:flex;gap:6px;margin-top:4px}.msg-actions button{border:0;background:transparent;color:inherit;opacity:.7;font-size:12px;padding:2px 4px}.reactions{display:flex;gap:4px;margin-top:3px;flex-wrap:wrap}.reaction{border:1px solid #ffffff33;border-radius:10px;padding:2px 6px;font-size:11px}.emoji-picker{position:fixed;z-index:60;bottom:72px;left:8px;right:8px;max-width:420px;margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 35px #00000030;padding:10px}.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;max-height:240px;overflow:auto}.emoji-grid button{border:0;background:transparent;color:var(--text);font-size:26px;padding:7px;border-radius:10px}.emoji-grid button:hover{background:var(--input)}.message-menu{position:fixed;z-index:50;min-width:220px;max-width:calc(100vw - 30px);background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 35px #00000030;padding:7px}.message-menu button{display:block;width:100%;border:0;background:transparent;color:var(--text);text-align:left;padding:11px 12px;border-radius:10px;font-size:15px}.message-menu button:hover{background:var(--input)}.message-menu .danger{color:#e5484d}.reaction-row{display:flex;gap:4px;padding:5px 6px;border-bottom:1px solid var(--line);margin-bottom:4px}.reaction-row button{width:auto;display:inline-block;padding:7px;font-size:20px;text-align:center}.pass-toggle{position:absolute;right:8px;top:6px;width:40px;height:42px;border:0;background:transparent;color:var(--muted);font-size:18px;cursor:pointer}

/* PC layout — mobile styles remain unchanged */
@media (min-width:900px){
  html,body{background:#dfe5ec}
  .app{max-width:none;width:min(1400px,100%);height:100dvh;margin:0 auto;box-shadow:0 0 30px #00000012;display:grid;grid-template-columns:380px 1fr;grid-template-rows:64px 1fr;position:relative}
  .app>.top{grid-column:1;grid-row:1;height:64px;padding:0 22px;background:var(--panel)}
  .app>.top .brand{font-size:23px}
  .app>.screen{grid-column:1;grid-row:2;padding:14px 18px;overflow:auto;border-right:1px solid var(--line);background:var(--panel)}
  .app>.screen .search{height:44px;border-radius:12px;margin-bottom:8px}
  .app>.chathead{grid-column:2;grid-row:1;height:64px;padding:8px 18px;background:var(--panel)}
  .app>.messages{grid-column:2;grid-row:2;padding:20px 7%;min-width:0}
  .app>.composer{grid-column:2;grid-row:3;position:absolute;left:380px;right:0;bottom:0;height:64px;padding:10px 18px}
  .app:has(>.chathead)>.top,.app:has(>.chathead)>.screen{display:none}
  .app:has(>.chathead){display:grid;grid-template-columns:380px 1fr;grid-template-rows:64px 1fr}
  .app:has(>.chathead)>.chathead{grid-column:1 / 3;grid-row:1}
  .app:has(>.chathead)>.messages{grid-column:1 / 3;grid-row:2;padding-left:8%;padding-right:8%;padding-bottom:78px}
  .app:has(>.chathead)>.composer{left:0;grid-column:1 / 3;grid-row:3}
  .app:has(>.profile)>.top{grid-column:1 / 3}
  .app:has(>.profile)>.profile{grid-column:1 / 3;grid-row:2;max-width:760px;width:100%;margin:auto}
  .bubble{max-width:65%;font-size:15px;padding:10px 14px}
  .chat{padding:12px 6px;border-radius:10px}
  .chat:hover{background:var(--input)}
  .search:focus,.field:focus,.composer input:focus{box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 20%,transparent)}
  .login{width:420px;margin:auto;padding:45px}
}
</style></head><body><div class="app" id="app"></div>
<script>
window.addEventListener("error",e=>{if(document.getElementById("app")&&!document.getElementById("app").innerHTML.trim())document.getElementById("app").innerHTML="<div class=empty>Ошибка загрузки SpiderGram. Обнови страницу.</div>"});window.addEventListener("unhandledrejection",e=>{console.error(e.reason)});const app=document.getElementById("app");let currentGroup=null;let token=localStorage.getItem("sgToken")||null,user=null,base=location.origin,sock,peer,typingTimer,recording=false,recorder,chunks=[];
function safeJSON(key,fallback){try{const raw=localStorage.getItem(key);return raw?JSON.parse(raw):fallback}catch(e){localStorage.removeItem(key);return fallback}}
user=safeJSON("sgUser",null);
const settings=safeJSON("sgSettings",{});
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
function applySettings(){const theme=settings.theme||"light";document.body.classList.toggle("dark",theme==="dark");document.documentElement.style.setProperty("--accent",settings.accent||"#1688ff");if(settings.bg){document.documentElement.style.setProperty("--messages","url(${settings.bg})")}}
applySettings();
async function api(path,opt={}){opt.headers={...(opt.headers||{}),...(token?{Authorization:"Bearer "+token}:{})};let r=await fetch(base+path,opt),d=await r.json().catch(()=>({}));if(r.status===401){localStorage.removeItem("sgToken");localStorage.removeItem("sgUser");token=null;user=null;if(sock)sock.disconnect();login();throw Error("Сессия истекла. Войдите в аккаунт заново")}if(!r.ok)throw Error(d.error||"Ошибка");return d}
function avatar(u,big=false){const n=esc((u?.name||u?.username||"?")[0].toUpperCase());return u?.avatar?'<img src="'+esc(u.avatar)+'" alt="">':n}
function login(){app.innerHTML=`<div class=login><h1>Spider<span class=blue>Gram</span></h1><p>Простой мессенджер для общения</p><input id=un class=field placeholder="Имя пользователя"><input id=pw class=field type=password placeholder="Пароль"><button class=primary onclick=doLogin()>Войти</button><button class=ghost onclick=register()>Создать аккаунт</button></div>`}
async function doLogin(){try{let d=await api("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:document.getElementById("un").value,password:document.getElementById("pw").value})});saveSession(d);home()}catch(e){alert(e.message)}}
function register(){app.innerHTML=`<div class=login><h1>Создать аккаунт</h1><p>Имя будет видно другим пользователям</p><input id=rn class=field placeholder="Имя"><input id=ru class=field placeholder="username"><div class=passwrap><input id=rp class=field type=password placeholder="Пароль (6+)"><button class=pass-toggle type=button onclick=togglePassword("rp",this)>◉</button></div><button class=primary onclick=doRegister()>Создать</button><button class=ghost onclick=login()>Назад</button></div>`}
async function togglePassword(id,btn){const x=document.getElementById(id);if(!x)return;x.type=x.type==="password"?"text":"password";btn.textContent=x.type==="password"?"◉":"●"}
async function doRegister(){try{let d=await api("/api/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:document.getElementById("rn").value,username:document.getElementById("ru").value,password:document.getElementById("rp").value})});saveSession(d);home()}catch(e){alert(e.message)}}
function saveSession(d){token=d.token;user=d.user;localStorage.sgToken=token;localStorage.sgUser=JSON.stringify(user);connect();requestNotify()}
function connect(){if(sock)sock.disconnect();sock=io(base,{auth:{token}});sock.on("message",m=>{if(peer&&m.from===peer.id){addMessage(m);markRead()}else{loadChats();notifyIncoming(m)}});sock.on("presence",p=>{if(peer&&p.userId===peer.id){peer.online=p.online;peer.lastSeen=p.lastSeen;updateStatus()}});sock.on("group:message",m=>{if(peer&&peer.groupId===m.groupId)addMessage(m);else loadChats();loadGroups()});sock.on("message:update",m=>{if(document.getElementById("msg-"+m.id))replaceMessage(m);else if(peer&&m.from===peer.id)addMessage(m);loadChats()});sock.on("reaction",m=>{const el=document.getElementById("msg-"+m.messageId);if(el){const x=el.querySelector(".reactions");const html=m.reactions?.length?`<div class=reactions>${m.reactions.map(r=>`<span class=reaction>${esc(r.emoji)}</span>`).join("")}</div>`:"";if(x)x.outerHTML=html;else if(html)el.insertAdjacentHTML("beforeend",html)}});sock.on("typing",p=>{if(peer&&p.from===peer.id){document.getElementById("status").textContent=p.typing?"печатает…":(peer.online?"онлайн":"не в сети");document.getElementById("status").classList.toggle("typing",!!p.typing)}})}
async function loadGroups(){try{const gs=await api("/api/groups");const el=document.getElementById("groups");if(el)el.innerHTML=gs.map(g=>`<div class=chat onclick='openGroup(${JSON.stringify(g)})'><div class=avatar>G</div><div class=chattext><div class=chatname>${esc(g.name)}</div><div class=preview>${g.members} участников</div></div></div>`).join("")||""}catch{}}
async function createGroup(){const name=prompt("Название группы:");if(!name)return;try{await api("/api/groups",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name})});home()}catch(e){alert(e.message)}}
async function openGroup(g){peer=g;peer.groupId=g.id;app.innerHTML=`<div class=chathead><button class=back onclick=home()>‹</button><div class=avatar>G</div><div><b>${esc(g.name)}</b><div class=status>${g.members} участников</div></div></div><div id=messages class=messages></div><div class=composer><input id=msg placeholder="Сообщение..." onkeydown='if(event.key==="Enter")sendGroup()'><button class="round" id="groupMic" onclick="toggleRecord()" aria-label="Записать голосовое"><span class="mic-icon">🎙️</span></button><button class=send onclick=sendGroup()>➤</button></div>`;const ms=await api("/api/groups/"+g.id+"/messages");document.getElementById("messages").innerHTML="";ms.forEach(addMessage)}
async function sendGroup(){const t=document.getElementById("msg").value.trim();if(!t)return;try{const m=await api("/api/groups/"+peer.id+"/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:t})});document.getElementById("msg").value="";addMessage(m)}catch(e){alert(e.message)}}
async function home(){peer=null;app.innerHTML=`<div class=top><div class=brand>Spider<span class=blue>Gram</span></div><button class="icon" id="settingsBtn" type="button">☰</button></div><div class=screen><input id=search class=search placeholder="Поиск пользователя..." oninput=searchUsers()><div class=group-create><input id=groupName placeholder="Новая группа"><button class=chip onclick=createGroup()>＋</button></div><div id=list></div><div class=section><h3>ГРУППЫ</h3><div id=groups></div></div></div>`;loadChats()}
async function loadChats(){try{let a=await api("/api/chats");renderChats(a);loadGroups()} catch(e){if(document.getElementById("list"))document.getElementById("list").innerHTML=`<div class=empty>${esc(e.message)}</div>`}}
function renderChats(a){document.getElementById("list").innerHTML=a.length?a.map(c=>`<div class=chat onclick='openChat(${JSON.stringify(c.user)})'><div class=avatar>${avatar(c.user)}</div><div class=chattext><div class=chatname>${c.pinned?"📌 ":""}${esc(c.user.name)} <span class=small>@${esc(c.user.username)}</span></div><div class=preview>${c.last.type==="image"?"📷 Фото":c.last.type==="audio"?"🎤 Голосовое":esc(c.last.text)}</div></div><div class=time>${new Date(c.last.createdAt).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})}</div></div>`).join(""):`<div class=empty>Нет чатов<br><br>Найди пользователя выше и начни общение</div>`}
let searchTimer;async function searchUsers(){clearTimeout(searchTimer);searchTimer=setTimeout(async()=>{try{let q=document.getElementById("search").value.trim();if(!q){loadChats();return}let a=await api("/api/users?q="+encodeURIComponent(q));renderUsers(a)}catch(e){if(document.getElementById("list"))document.getElementById("list").innerHTML=`<div class=empty>${esc(e.message)}</div>`}},250)}
async function loadGroups(){try{let gs=await api("/api/groups");const el=document.getElementById("groups");if(!el)return;el.innerHTML=gs.map(g=>`<div class=chat onclick='openGroup(${JSON.stringify(g)})'><div class=avatar>👥</div><div class=chattext><div class=chatname>${esc(g.name)} <span class=badge>${g.members}</span></div><div class=preview>Групповой чат</div></div></div>`).join("")||`<div class=empty style="padding:15px">Групп пока нет</div>`}catch{}}
async function createGroup(){const n=document.getElementById("groupName")?.value.trim();if(!n)return alert("Введите название группы");try{await api("/api/groups",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:n,members:[]})});document.getElementById("groupName").value="";loadChats()}catch(e){alert(e.message)}}
async function addGroupMemberPrompt(){if(!currentGroup)return;const username=prompt("Введите username участника:");if(!username)return;try{const users=await api("/api/users?q="+encodeURIComponent(username.trim()));const u=users.find(x=>x.username.toLowerCase()===username.trim().toLowerCase());if(!u)return alert("Пользователь не найден");await api("/api/groups/"+currentGroup.id+"/members",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({userId:u.id})});alert("Участник добавлен")}catch(e){alert(e.message)}}
async function showUserProfile(username){try{const users=await api("/api/users?q="+encodeURIComponent(username));const x=users.find(u=>u.username===username);if(!x)return;app.innerHTML="<div class=top><button class=icon onclick=home()>‹</button><div class=brand>Профиль</div><span></span></div><div class=profile><div class=bigavatar>"+avatar(x)+"</div><h2>"+esc(x.name)+"</h2><p>@"+esc(x.username)+"</p><div class=section><div class=setting><span>Статус</span><b>"+(x.online?"онлайн":"не в сети")+"</b></div></div></div>"}catch(e){alert(e.message)}}
async function groupInfo(){if(!currentGroup)return;try{const g=await api("/api/groups/"+currentGroup.id);app.innerHTML=`<div class=top><button class=icon onclick='openGroup(currentGroup)'>‹</button><div class=brand>Группа</div><span></span></div><div class=profile><div class=bigavatar>👥</div><input id=gn class=field value="${esc(g.name)}"><button class=primary onclick=saveGroup()>Сохранить</button><div class=section><h3>УЧАСТНИКИ · ${g.members.length}</h3><div id=members>${g.members.map(m=>`<div class=chat><div class=avatar>${avatar(m)}</div><div class=chattext><div class=chatname>${esc(m.name)}</div><div class=preview>@${esc(m.username)} · ${m.role==="admin"?"администратор":"участник"}</div></div>${m.id===user.id?"":`<button class=chip onclick='removeMember("${m.id}")'>Удалить</button>`}</div>`).join("")}</div></div></div>`}catch(e){alert(e.message)}}
async function saveGroup(){try{await api("/api/groups/"+currentGroup.id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:document.getElementById("gn").value})});currentGroup.name=document.getElementById("gn").value;openGroup(currentGroup)}catch(e){alert(e.message)}}
async function removeMember(uid){if(!confirm("Удалить участника?"))return;try{await api("/api/groups/"+currentGroup.id+"/members/"+uid,{method:"DELETE"});groupInfo()}catch(e){alert(e.message)}}
async function openGroup(g){currentGroup=g;peer=null;app.innerHTML=`<div class=chathead><button class=back onclick=home()>‹</button><button class="avatar" style="border:0" onclick=groupInfo()>👥</button><div><b>${esc(g.name)}</b><div class=status>Группа · ${g.members}</div></div><button class=icon onclick=addGroupMemberPrompt()>＋</button><button class=icon onclick=groupInfo()>⚙</button></div><div id=messages class=messages></div><div class=composer><input id=msg placeholder="Сообщение..." onkeydown='if(event.key==="Enter")sendGroup()'><button class="round" id="groupMic" onclick="toggleRecord()" aria-label="Записать голосовое"><span class="mic-icon">🎙️</span></button><button class=send onclick=sendGroup()>➤</button></div>`;const ms=await api("/api/groups/"+g.id+"/messages");document.getElementById("messages").innerHTML="";ms.forEach(addMessage)}
async function sendGroup(){const t=document.getElementById("msg").value.trim();if(!t||!currentGroup)return;try{const m=await api("/api/groups/"+currentGroup.id+"/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:t,type:"text"})});document.getElementById("msg").value="";addMessage(m)}catch(e){alert(e.message)}}
function renderUsers(a){document.getElementById("list").innerHTML=a.length?a.map(x=>`<div class=chat onclick='openChat(${JSON.stringify(x)})'><div class=avatar>${avatar(x)}</div><div class=chattext><div class=chatname>${esc(x.name)}</div><div class=preview>@${esc(x.username)} ${x.online?"• онлайн":""}</div></div></div>`).join(""):`<div class=empty>Пользователь не найден</div>`}
async function openChat(x){peer=x;app.innerHTML=`<div class=chathead><button class=back onclick=home()>‹</button><button class="avatar" style="border:0" onclick='showUserProfile("${x.username}")'>${avatar(x)}</button><div><b>${esc(x.name)}</b><div id=status class=status></div></div></div><div id=messages class=messages></div><div class=composer><button class=round onclick=document.getElementById("photo").click()>＋</button><input id=photo class=hidden type=file accept="image/*" multiple onchange=sendPhotos(event)><input id=msg placeholder="Сообщение..." oninput=notifyTyping() onkeydown='if(event.key==="Enter")send()'><button class="round" id="mic" onclick="toggleRecord()" aria-label="Записать голосовое"><span class="mic-icon">🎙️</span></button><button class="round emoji-btn" type="button" onclick="toggleEmojiPicker()" aria-label="Смайлики">😊</button><button class=send onclick=send()>➤</button></div>`;updateStatus();let ms=await api("/api/messages/"+x.id);document.getElementById("messages").innerHTML="";ms.forEach(addMessage);markRead()}
function updateStatus(){if(!peer)return;document.getElementById("status").textContent=peer.online?"онлайн":peer.lastSeen?"был(а) недавно":"не в сети";document.getElementById("status").classList.remove("typing")}
function messageHtml(m){let body=m.type==="image"?`<img onclick="event.stopPropagation()" src="${esc(m.mediaUrl)}" alt="Фото">`:m.type==="audio"?`<audio onclick="event.stopPropagation()" controls src="${esc(m.mediaUrl)}"></audio>`:esc(m.text);return `<div id="msg-${m.id}" class="bubble ${m.from===user.id?"me":""}" data-msg-id="${esc(m.id)}" data-msg-text="${esc(m.text||"")}" onclick="messageActions(event,this.dataset.msgId,this.dataset.msgText,this.classList.contains('me'))">${body}${m.edited&&!m.deleted?" <small>(изменено)</small>":""}<div class=meta>${new Date(m.createdAt).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})}</div>${m.reactions?.length?`<div class=reactions>${m.reactions.map(r=>`<span class=reaction>${esc(r.emoji)}</span>`).join("")}</div>`:""}</div>`}

function closeMessageMenu(){document.getElementById("messageMenu")?.remove()}
function messageActions(e,id,old,mine){e.stopPropagation();closeMessageMenu();const menu=document.createElement("div");menu.id="messageMenu";menu.className="message-menu";const row=document.createElement("div");row.className="reaction-row";["❤️","👍","😂","😮","😢","🔥"].forEach(emoji=>{const b=document.createElement("button");b.type="button";b.textContent=emoji;b.onclick=()=>reactMessage(id,emoji);row.appendChild(b)});menu.appendChild(row);const add=(label,fn,cls)=>{const b=document.createElement("button");b.type="button";b.textContent=label;if(cls)b.className=cls;b.onclick=fn;menu.appendChild(b)};add("📌  Закрепить / открепить",()=>pinMessage(id));if(mine){add("✏️  Изменить",()=>editMessage(id,old));add("🗑️  Удалить",()=>deleteMessage(id),"danger")}document.body.appendChild(menu);const bubble=e.target.closest(".bubble[data-msg-id]");const r=bubble?.getBoundingClientRect?.()||{left:20,top:100,bottom:100};const left=Math.min(Math.max(8,r.left),window.innerWidth-menu.offsetWidth-8);const top=Math.min(r.bottom+5,window.innerHeight-menu.offsetHeight-8);menu.style.left=left+"px";menu.style.top=Math.max(8,top)+"px";setTimeout(()=>document.addEventListener("click",closeMessageMenu,{once:true}),0)}
async function reactMessage(id,emoji){closeMessageMenu();try{await api("/api/messages/"+encodeURIComponent(id)+"/reactions",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({emoji})})}catch(e){alert("Не удалось поставить реакцию: "+e.message)}}
async function pinMessage(id){closeMessageMenu();try{const r=await api("/api/messages/"+encodeURIComponent(id)+"/pin",{method:"POST"});alert(r.pinned?"📌 Сообщение закреплено":"📌 Сообщение откреплено")}catch(e){alert(e.message)}}
function addMessage(m){if(!document.getElementById("messages"))return;document.getElementById("messages").insertAdjacentHTML("beforeend",messageHtml(m));document.getElementById("messages").scrollTop=document.getElementById("messages").scrollHeight}
function replaceMessage(m){const el=document.getElementById("msg-"+m.id);if(el)el.outerHTML=messageHtml(m)}
async function editMessage(id,old){closeMessageMenu();const t=prompt("Изменить сообщение:",old);if(t===null||t.trim()===old.trim())return;try{const m=await api("/api/messages/"+encodeURIComponent(id),{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:t.trim()})});replaceMessage(m)}catch(e){alert("Не удалось изменить сообщение: "+e.message)}}
async function deleteMessage(id){closeMessageMenu();if(!confirm("Удалить сообщение?"))return;try{const m=await api("/api/messages/"+encodeURIComponent(id),{method:"DELETE"});replaceMessage(m)}catch(e){alert("Не удалось удалить сообщение: "+e.message)}}
const emojiList=["😀","😃","😄","😁","😆","😅","😂","🤣","😊","😇","🙂","🙃","😉","😌","😍","🥰","😘","😗","😙","😚","😋","😛","😝","😜","🤪","🤨","🧐","🤓","😎","🤩","🥳","😏","😒","😞","😔","😟","😕","🙁","☹️","😣","😖","😫","😩","🥺","😢","😭","😤","😠","😡","🤬","🤯","😳","🥵","🥶","😱","😨","😰","😥","😓","🤗","🤔","🫣","🤭","🫢","🫡","🤫","🫠","🤥","😶","🫥","😐","😑","😬","🙄","😯","😦","😧","😮","😲","🥱","😴","🤤","😪","😵","🤐","🤢","🤮","🤧","😷","🤒","🤕","👍","👎","👏","🙌","👐","🤝","🙏","💪","❤️","🧡","💛","💚","💙","💜","🖤","🤍","🤎","💔","💯","🔥","✨","🎉","💩","👀","👋","🤟","💋","🌹","⭐","☀️","🌙"];function toggleEmojiPicker(){const old=document.getElementById("emojiPicker");if(old){old.remove();return}const p=document.createElement("div");p.id="emojiPicker";p.className="emoji-picker";const grid=document.createElement("div");grid.className="emoji-grid";emojiList.forEach(x=>{const b=document.createElement("button");b.type="button";b.textContent=x;b.onclick=()=>{const i=document.getElementById("msg");if(i){i.value+=x;i.focus()}p.remove()};grid.appendChild(b)});p.appendChild(grid);document.body.appendChild(p);setTimeout(()=>document.addEventListener("click",e=>{if(!e.target.closest("#emojiPicker")&&!e.target.closest(".emoji-btn"))p.remove()},{once:true}),0)}
async function send(){let t=document.getElementById("msg").value.trim();if(!t)return;try{let m=await api("/api/messages/"+peer.id,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:t,type:"text"})});document.getElementById("msg").value="";addMessage(m)}catch(e){alert(e.message)}}
function markRead(){if(peer&&sock)sock.emit("read",{to:peer.id})}
function notifyTyping(){if(!peer||!sock)return;sock.emit("typing",{to:peer.id,typing:true});clearTimeout(typingTimer);typingTimer=setTimeout(()=>sock.emit("typing",{to:peer.id,typing:false}),900)}
async function sendPhotos(e){const files=[...(e.target.files||[])];e.target.value="";if(!files.length||(!peer&&!currentGroup))return;for(const f of files){if(!f.type.startsWith("image/"))continue;if(f.size>4*1024*1024){alert("Фото должно быть меньше 4 МБ: "+f.name);continue}await new Promise(resolve=>{const r=new FileReader();r.onload=async()=>{try{const path=currentGroup?"/api/groups/"+currentGroup.id+"/messages":"/api/messages/"+peer.id;const m=await api(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({type:"image",mediaUrl:r.result})});addMessage(m)}catch(x){alert(x.message)}finally{resolve()}};r.readAsDataURL(f)})}}async function toggleRecord(){const button=document.getElementById("mic")||document.getElementById("groupMic");if(recording){recorder.stop();recording=false;if(button){button.classList.remove("recording");button.innerHTML='<span class="mic-icon">🎙️</span>'}return}if(!navigator.mediaDevices?.getUserMedia)return alert("Запись голоса не поддерживается этим браузером");try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{stream.getTracks().forEach(t=>t.stop());const blob=new Blob(chunks,{type:recorder.mimeType||"audio/webm"});if(blob.size>5*1024*1024)return alert("Голосовое слишком большое");showVoicePreview(blob)};recorder.start();recording=true;if(button){button.classList.add("recording");button.innerHTML='<span class="mic-icon">⏹</span>'}}catch(e){alert("Разреши доступ к микрофону в настройках SpiderGram")}}function showVoicePreview(blob){document.getElementById("voicePreview")?.remove();const composer=document.querySelector(".composer");if(!composer)return;const url=URL.createObjectURL(blob);composer.insertAdjacentHTML("beforebegin",'<div class="voice-preview" id="voicePreview"><audio controls src="'+url+'"></audio><button onclick="cancelVoice()">✕</button><button class="voice-send" onclick="sendVoice()">➤</button></div>');window.pendingVoice={blob,url}}function cancelVoice(){if(window.pendingVoice){URL.revokeObjectURL(window.pendingVoice.url);window.pendingVoice=null}document.getElementById("voicePreview")?.remove()}async function sendVoice(){if(!window.pendingVoice)return;const blob=window.pendingVoice.blob;const r=new FileReader();r.onload=async()=>{try{const path=currentGroup?"/api/groups/"+currentGroup.id+"/messages":"/api/messages/"+peer.id;const m=await api(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({type:"audio",mediaUrl:r.result})});cancelVoice();addMessage(m)}catch(e){alert(e.message)}};r.readAsDataURL(blob)}async function requestNotify(){if("Notification"in window&&Notification.permission==="default")try{await Notification.requestPermission()}catch{}}
function notifyIncoming(m){if(m.from===user.id||!("Notification"in window)||Notification.permission!=="granted")return;const n=new Notification("SpiderGram",{body:m.type==="image"?"📷 Новое фото":m.type==="audio"?"🎤 Новое голосовое":m.text});setTimeout(()=>n.close(),4000)}
async function requestMic(){if(!navigator.mediaDevices?.getUserMedia)return alert("Браузер не поддерживает микрофон");try{const s=await navigator.mediaDevices.getUserMedia({audio:true});s.getTracks().forEach(t=>t.stop());settings.mic=true;localStorage.sgSettings=JSON.stringify(settings);profile()}catch(e){alert("Доступ к микрофону запрещён. Разреши микрофон для сайта в настройках браузера.")}}async function profile(){try{let me=user||await api("/api/me");app.innerHTML=`<div class=top><button class=icon onclick=home()>‹</button><div class=brand>Настройки</div><span></span></div><div class=profile><div class=bigavatar id=bigav>${avatar(me)}</div><input id=avatarFile class=hidden type=file accept="image/*" onchange=changeAvatar(event)><button class=ghost onclick=document.getElementById("avatarFile").click()>Изменить аватар</button><h2>${esc(me.name)}</h2><p>@${esc(me.username)}</p><div class=section><h3>АККАУНТ</h3><input id=pn class=field value="${esc(me.name)}"><button class=primary onclick=saveProfile()>Сохранить профиль</button></div><div class=section><h3>ТЕМА</h3><div class=chips><button class="chip ${(settings.theme||"light")==="light"?"active":""}" onclick=setTheme("light")>☀️ Светлая</button><button class="chip ${settings.theme==="dark"?"active":""}" onclick=setTheme("dark")>🌙 Тёмная</button><button class="chip ${settings.theme==="system"?"active":""}" onclick=setTheme("system")>📱 Системная</button></div></div><div class=section><h3>ОФОРМЛЕНИЕ</h3><div class=setting><span>Цвет интерфейса</span><input type=color value="${settings.accent||"#1688ff"}" onchange=setAccent(this.value)></div><div class=setting><span>Фон чатов</span><button class=chip onclick=document.getElementById("bgFile").click()>Выбрать</button></div><input id=bgFile class=hidden type=file accept="image/*" onchange=setBackground(event)><button class=ghost onclick=clearBackground()>Сбросить фон</button></div><div class=section><h3>РАЗРЕШЕНИЯ</h3><div class=setting><span>🎙️ Микрофон</span><button class=chip onclick=requestMic()>Проверить доступ</button></div><div class=setting><span>🔔 Уведомления</span><button class=chip onclick=requestNotify()>Разрешить</button></div><div class=notice>Разрешения управляются браузером и настройками сайта.</div></div><div class=section><h3>УВЕДОМЛЕНИЯ</h3><button class=primary onclick=requestNotify()>Разрешить уведомления</button><div class=notice>Уведомления работают, когда браузер разрешил их для SpiderGram.</div></div><button class=ghost onclick=logout()>Выйти из аккаунта</button></div>`}catch(e){alert("Не удалось открыть настройки: "+e.message);home()}}
async function saveProfile(){let me=await api("/api/me",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:document.getElementById("pn").value})});user=me;localStorage.sgUser=JSON.stringify(me);alert("Профиль сохранён");home()}
async function changeAvatar(e){const f=e.target.files[0];if(!f)return;if(f.size>2*1024*1024)return alert("Аватар должен быть меньше 2 МБ");const r=new FileReader();r.onload=async()=>{try{if(!token)throw Error("Сессия истекла. Войди в аккаунт заново");let me=await api("/api/me",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({avatar:r.result})});user=me;localStorage.sgUser=JSON.stringify(me);if(document.getElementById("bigav"))document.getElementById("bigav").innerHTML=avatar(me);alert("Аватар изменён")}catch(x){alert("Не удалось изменить аватар: "+x.message)}};r.readAsDataURL(f)}
function setTheme(v){settings.theme=v;localStorage.sgSettings=JSON.stringify(settings);applySettings();profile()}
function setAccent(v){settings.accent=v;localStorage.sgSettings=JSON.stringify(settings);applySettings();profile()}
function setBackground(e){const f=e.target.files[0];if(!f)return;if(f.size>3*1024*1024)return alert("Фон должен быть меньше 3 МБ");const r=new FileReader();r.onload=()=>{settings.bg=r.result;localStorage.sgSettings=JSON.stringify(settings);applySettings();profile()};r.readAsDataURL(f)}
function clearBackground(){delete settings.bg;localStorage.sgSettings=JSON.stringify(settings);applySettings();profile()}
function logout(){localStorage.removeItem("sgToken");localStorage.removeItem("sgUser");token=null;user=null;if(sock)sock.disconnect();login()}
document.addEventListener("click",e=>{if(e.target.closest("#settingsBtn"))profile()});token&&user?(connect(),home()):login();
</script></body></html>
