  const [chats,groups]=await Promise.all([api("/api/chats"),api("/api/groups")]);
  const chatRows=await Promise.all((chats||[]).slice(0,12).map(async c=>{
   try{const ms=await api("/api/messages/"+encodeURIComponent(c.user.id));return {name:c.user.name,count:(ms||[]).filter(m=>Number(m.createdAt)>since&&m.from!==user.id).length}}
   catch{return {name:c.user.name,count:0}}
  }));
  const groupRows=await Promise.all((groups||[]).slice(0,12).map(async g=>{
   try{const ms=await api("/api/groups/"+encodeURIComponent(g.id)+"/messages");return {name:g.name,count:(ms||[]).filter(m=>Number(m.createdAt)>since&&m.from!==user.id).length}}
   catch{return {name:g.name,count:0}}
  }));
  const newChats=chatRows.filter(x=>x.count>0).sort((a,b)=>b.count-a.count);
  const newGroups=groupRows.filter(x=>x.count>0).sort((a,b)=>b.count-a.count);
  const totalChats=newChats.reduce((n,x)=>n+x.count,0),totalGroups=newGroups.reduce((n,x)=>n+x.count,0);
  const rows=[];
  if(totalChats)rows.push("💬 Новых сообщений: <b>"+totalChats+"</b>");
  newChats.slice(0,3).forEach(x=>rows.push("• "+esc(x.name)+": <b>"+x.count+"</b>"));

  newGroups.slice(0,2).forEach(x=>rows.push("• "+esc(x.name)+": <b>"+x.count+"</b>"));

  overlay.querySelector("button").onclick=closeReturnSummary;overlay.addEventListener("click",e=>{if(e.target===overlay)closeReturnSummary();});document.body.appendChild(overlay);

function formatLastSeen(ts){if(!ts)return"не в сети";const d=new Date(Number(ts));const now=new Date();const time=d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});if(d.toDateString()===now.toDateString())return"был(а) сегодня в "+time;const y=new Date(now);y.setDate(now.getDate()-1);if(d.toDateString()===y.toDateString())return"был(а) вчера в "+time;return"был(а) "+d.toLocaleDateString([], {day:"2-digit",month:"2-digit",year:"numeric"})+" в "+time}function updateStatus(){if(!peer)return;const exact=settings.exactLastSeen!==false;document.getElementById("status").textContent=peer.online?"онлайн":peer.lastSeen?(exact?formatLastSeen(peer.lastSeen):"был(а) недавно"):"не в сети";document.getElementById("status").classList.remove("typing")}

const pollMessageCache={};
function pollTimeLabel(endsAt){if(!endsAt)return"Без ограничения по времени";const left=Number(endsAt)-Date.now();if(left<=0)return"Опрос завершён";const s=Math.floor(left/1000),d=Math.floor(s/86400),h=Math.floor((s%86400)/3600),m=Math.floor((s%3600)/60);return d?d+" дн. "+h+" ч.":h?h+" ч. "+m+" мин.":m?m+" мин.":"меньше минуты"}
function pollHtml(m){
 const p=m.poll;if(!p||!Array.isArray(p.options))return"<b>Опрос</b>";
 const counts=p.counts||p.options.map(()=>0),total=counts.reduce((a,b)=>a+Number(b||0),0),mine=Array.isArray(p.mine)?p.mine:[],ended=!!(p.endsAt&&Date.now()>=Number(p.endsAt)),multiple=p.multiple===true;
 const opts=p.options.map((label,i)=>{const pct=total?Math.round(Number(counts[i]||0)*100/total):0,active=mine.includes(i);return `<button type="button" class="poll-option ${active?"active":""}" onclick='event.stopPropagation();votePoll(${JSON.stringify(m.id)},${i},${multiple})'${ended?" disabled":""}><span class="poll-fill" style="width:${pct}%"></span><span class="poll-row"><span class="poll-label">${multiple?(active?"☑ ":"☐ "):""}${esc(String(label))}</span><span class="poll-count">${pct}%</span></span></button>`}).join("");
 const footer=ended?"Опрос завершён":(multiple?`<div class="poll-actions"><button class="poll-submit" onclick='event.stopPropagation();submitPollSelection(${JSON.stringify(m.id)})'>Проголосовать</button></div>`:"");
 return `<div class="poll-card"><div class="poll-title">📊 ${esc(p.question||"Опрос")}</div><div class="poll-meta">${p.anonymous?"Анонимный":"Обычный"}${multiple?" · несколько вариантов":" · один вариант"} · <span id="poll-time-${esc(m.id)}">${esc(pollTimeLabel(p.endsAt))}</span> · ${total} ${total===1?"голос":"голосов"}</div>${opts}${footer}</div>`;
}

function messageHtml(m){if(m.deleted||m.type==="deleted")return"";if(m.type==="poll")pollMessageCache[m.id]=m;let body=m.type==="poll"?pollHtml(m):m.type==="image"?'<img onclick="event.stopPropagation()" src="'+esc(m.mediaUrl)+'" alt="Фото">':m.type==="video"?'<video onclick="event.stopPropagation()" controls playsinline style="max-width:100%;max-height:420px;border-radius:11px" src="'+esc(m.mediaUrl)+'"></video>':m.type==="audio"?'<audio onclick="event.stopPropagation()" controls src="'+esc(m.mediaUrl)+'"></audio>':esc(m.text);return '<div id="msg-'+m.id+'" class="bubble '+(m.from===user.id?"me":"")+'" data-msg-id="'+esc(m.id)+'" data-msg-text="'+esc(m.text||"")+'" onclick="messageActions(event,this.dataset.msgId,this.dataset.msgText,this.classList.contains(\'me\'))">'+body+(m.edited&&!m.deleted?" <small>(изменено)</small>":"")+'<div class=meta>'+new Date(m.createdAt).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})+(m.from===user.id&&m.read?' <span class="read-status">· прочитано</span>':"")+'</div>'+(m.reactions?.length?'<div class=reactions>'+m.reactions.map(r=>'<span class=reaction>'+esc(r.emoji)+'</span>').join("")+'</div>':"")+'</div>'}
function votePoll(id,index,multiple){const m=pollMessageCache[id],p=m?.poll;if(!p||p._voting)return;if(p.endsAt&&Date.now()>=Number(p.endsAt))return;if(multiple){p._selected=p._selected instanceof Set?p._selected:new Set(p.mine||[]);if(p._selected.has(index))p._selected.delete(index);else p._selected.add(index);pollMessageCache[id].poll={...p,mine:[...p._selected]};replaceMessage(pollMessageCache[id]);return}submitPollVote(id,[index])}
async function submitPollVote(id,selected){
 const m=pollMessageCache[id],p=m?.poll;if(!m||!p||p._voting)return;
 const clean=[...new Set((Array.isArray(selected)?selected:[]).map(Number).filter(Number.isInteger))];
 if(!clean.length)return alert("Выбери вариант");
 if(p.endsAt&&Date.now()>=Number(p.endsAt))return;
 p._voting=true;
 try{
  const r=await api("/api/polls/"+encodeURIComponent(id)+"/vote",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({optionIndexes:clean})});
  delete r._voting;delete r._selected;
  pollMessageCache[id]={...m,poll:{...r,_voting:false}};
  replaceMessage(pollMessageCache[id]);
 }catch(e){
  p._voting=false;
  alert(e?.message||"Не удалось проголосовать. Попробуй ещё раз.");
 }
}
function submitPollSelection(id){const p=pollMessageCache[id]?.poll;if(!p)return;const selected=p._selected instanceof Set?[...p._selected]:(p.mine||[]);if(!selected.length)return alert("Выбери вариант");submitPollVote(id,selected)}

9);background-size:250% 250%",neon:"background:linear-gradient(120deg,#06111f,#0e7490,#7e22ce,#be185d);background-size:250% 250%",rain:"background-color:#06110a;background-image:linear-gradient(110deg,transparent 0 46%,#22c55e44 47%,transparent 48%);background-size:14px 24px",sunset_anim:"background:linear-gradient(120deg,#431407,#f97316,#facc15,#7c2d12);background-size:250% 250%",digital_rain:"background-color:#020b08;background-image:repeating-linear-gradient(100deg,transparent 0 12px,#22c55e33 13px,transparent 14px);background-size:30px 60px",cosmos_anim:"background:radial-gradient(circle at 20% 20%,#a855f755,transparent 25%),radial-gradient(circle at 80% 70%,#0ea5e955,transparent 30%),linear-gradient(135deg,#020617,#111827,#312e81);background-size:180% 180%",cloudy_sky:"background:radial-gradient(ellipse at 10% 18%,#555b64 0%,#343a43 20%,transparent 50%),radial-gradient(ellipse at 84% 16%,#20252d 0%,#4a515b 22%,transparent 56%),radial-gradient(ellipse at 56% 78%,#424851 0%,#20252c 25%,transparent 60%),radial-gradient(ellipse at 18% 88%,#080b10 0%,#252a31 24%,transparent 58%),linear-gradient(135deg,#080a0e,#20242b,#0b0e13);background-size:180% 180%,200% 200%,190% 190%,210% 210%,100% 100%;animation:cloudySkyFlow 42s ease-in-out infinite alternate",night_city:"background:radial-gradient(circle at 78% 22%,#38bdf8aa,transparent 20%),radial-gradient(circle at 28% 58%,#a855f7aa,transparent 24%),linear-gradient(135deg,#050711,#111827,#09040f);background-size:180% 180%",northern_lights:"background:radial-gradient(ellipse at 25% 20%,#22d3eeaa,transparent 32%),radial-gradient(ellipse at 70% 32%,#8b5cf6aa,transparent 36%),linear-gradient(160deg,#020617,#07111e,#05030c);background-size:180% 180%",blood_moon:"background:radial-gradient(circle at 72% 28%,#ef4444aa,transparent 25%),linear-gradient(135deg,#050509,#17070b,#030305);background-size:180% 180%",black_sand:"background:repeating-radial-gradient(ellipse at 50% 115%,#020204 0 7px,#17191d 8px 15px,#050608 16px 24px),linear-gradient(135deg,#08090c,#1b1f26,#050608);background-size:120% 180%,100% 100%",deep_ocean_anim:"background:repeating-radial-gradient(ellipse at 50% 115%,#164e63 0 4px,#082f49 5px 12px,#020617 13px 25px),linear-gradient(180deg,#020617,#082f49);background-size:120% 180%",galaxy_anim:"background:radial-gradient(circle at 20% 30%,#8b5cf6aa,transparent 22%),radial-gradient(circle at 78% 65%,#2563eb99,transparent 25%),radial-gradient(circle at 52% 20%,#ec489977,transparent 18%),linear-gradient(135deg,#020207,#080b18,#03030a);background-size:180% 180%,190% 190%,180% 180%,100% 100%",waves:"background:repeating-radial-gradient(ellipse at 50% 120%,#22d3ee33 0 3px,transparent 4px 28px),linear-gradient(135deg,#020617,#172554,#581c87);background-size:100% 180%",spider_neon:"background:radial-gradient(circle at 20% 30%,#ef444455,transparent 24%),radial-gradient(circle at 80% 70%,#2563eb55,transparent 26%),linear-gradient(135deg,#020207,#10030b,#020b18);background-size:180% 180%",spider_web_anim:"background-color:#050509;background-image:radial-gradient(circle at 50% 50%,transparent 0 16%,#ef444433 17%,transparent 18%),linear-gradient(30deg,transparent 48%,#ffffff1c 49%,#ffffff1c 50%,transparent 51%),linear-gradient(150deg,transparent 48%,#ffffff1c 49%,#ffffff1c 50%,transparent 51%);background-size:180px 180px,90px 90px,90px 90px"};style=bg[x.value]||"background:"+v;animated=true;}else if(x.type==="message_style"){const ms={glass:"background:#ffffff22;border:1px solid #ffffff77;backdrop-filter:blur(5px)",neon:"background:#101827;border:1px solid #22d3ee;box-shadow:0 0 10px #22d3ee33",soft:"background:#312e81;border-radius:20px",outline:"background:transparent;border:1px solid #ffffff66",bubble:"background:#ffffff18;border:1px solid #ffffff22;border-radius:18px;box-shadow:0 5px 16px #0003",terminal:"background:#06110a;border:1px solid #22c55e;color:#86efac",gradient:"background:linear-gradient(135deg,#2563eb,#8b5cf6,#ec4899);border:0"};style=ms[x.value]||"background:var(--accent)";label="Aa";}else if(x.type==="avatar_frame"){const fr={neon:"background:transparent;border:3px solid #00d9ff;box-shadow:0 0 12px #00d9ff",gold:"background:transparent;border:3px solid #f5c542;box-shadow:0 0 12px #f5c542",ice:"background:transparent;border:3px solid #67e8f9;box-shadow:0 0 12px #67e8f9",fire:"background:transparent;border:3px solid #fb7185;box-shadow:0 0 20px #f97316",purple:"background:transparent;border:3px solid #c084fc;box-shadow:0 0 18px #c084fc",diamond:"background:transparent;border:3px solid #f5d0fe;box-shadow:0 0 20px #c084fc",rainbow:"background:transparent;border:3px solid #ec4899;box-shadow:0 0 18px #22d3ee",aurora:"background:transparent;border:3px solid #34d399;box-shadow:0 0 18px #8b5cf6",blackgold:"background:transparent;border:3px solid #facc15;box-shadow:0 0 16px #facc15"};style=fr[x.value]||fr.gold;animated=["diamond","rainbow","aurora"].includes(x.value);}else if(x.type==="profile_effect"){const ef={glow:"background:var(--accent);box-shadow:0 0 20px var(--accent)",pulse:"background:var(--accent);box-shadow:0 0 8px var(--accent)",ring:"background:var(--accent);box-shadow:0 0 0 5px #8b5cf6,0 0 28px #8b5cf6",shadow:"background:var(--accent);box-shadow:0 16px 35px #0009",spark:"background:#f0abfc;box-shadow:0 0 24px #f0abfc",orbit:"background:#22d3ee;box-shadow:0 0 0 5px #8b5cf6,0 0 25px #22d3ee",flame:"background:#fb923c;box-shadow:0 0 24px #ef4444",aurora:"background:#8b5cf6;box-shadow:0 0 25px #22d3ee"};style=ef[x.value]||ef.glow;animated=["pulse","spark","orbit","flame","aurora"].includes(x.value);}return '<div class="shop-preview-orb'+(animated?" animated":"")+'" style="'+style+'">'+(label?"<span>"+label+"</span>":"")+"</div>"}
async function loadShop(){try{
const d=await api("/api/shop");
const grouped={};d.items.forEach(x=>(grouped[x.type]??=[]).push(x));
const recommended=["color_cyan","gradient_aurora","bg_stars","bg_aurora","msg_glass","frame_neon","effect_glow","title_error404"];
const card=x=>'<div class="shop-item"><div class="shop-item-top"><div style="flex:1"><div class="shop-item-name">'+esc(x.name)+'</div><div class="shop-item-desc">'+esc(x.description)+'</div></div><div class="shop-price">'+x.price+' SP</div></div><div class="shop-preview">'+shopPreview(x)+'</div><div class="shop-actions">'+(x.owned?'<button class="'+(x.equipped?"ghost":"chip")+'" onclick="equipShopItem(\''+x.id+'\')">'+(x.equipped?"Снять":"Использовать")+'</button>':'<button class="primary" onclick="buyShopItem(\''+x.id+'\')">Купить</button>')+'</div></div>';
const sectionContent=(items,empty="Пока ничего нет")=>(items||[]).map(card).join('')||'<div class="empty">'+empty+'</div>';
const accordion=(title,id,items,open=false)=>'<div class="shop-accordion"><button class="shop-accordion-head" type="button" aria-expanded="'+(open?"true":"false")+'" onclick="toggleShopSection(\''+id+'\',this)"><span>'+title+'</span><span class="shop-accordion-arrow" id="arrow-'+id+'">'+(open?"⌃":"⌄")+'</span></button><div id="'+id+'" class="shop-accordion-body'+(open?"":" hidden")+'">'+sectionContent(items)+'</div></div>';
const recommendations=d.items.filter(x=>recommended.includes(x.id));
const sections=[
["recommendations","⭐ Рекомендации",recommendations],
["color","🎨 Цвета интерфейса",grouped.color],
["gradient","🌈 Градиенты",grouped.gradient],
["background","🖼️ Особые фоны",grouped.background],
["animated_background","✨ Анимированные фоны",grouped.animated_background],
["message_style","💬 Стили сообщений",grouped.message_style],
["avatar_frame","⭕ Рамки аватара",grouped.avatar_frame],
["profile_effect","👤 Эффекты профиля",grouped.profile_effect],
["title","🏆 Титулы",grouped.title]
];
app.innerHTML='<div class="shop-screen"><div class="top"><button class="icon" onclick="profile()">‹</button><div class="brand">🛒 Магазин</div><span></span></div><div class="shop-head"><h2 style="margin:0 0 5px">Магазин SpiderGram</h2><div style="color:var(--muted);font-size:13px">Разделы магазина — сверху. Нажми на нужный раздел, чтобы открыть его.</div></div><div class="shop-balance"><span>Баланс</span><b>'+d.currency+' SP</b></div><div class="shop-categories">'+sections.map((s,i)=>accordion(s[1],s[0],s[2],i===0)).join("")+'</div></div>';enhanceShopLayout();
}catch(e){alert("Не удалось открыть магазин: "+e.message)}}
function enhanceShopLayout(){const root=document.querySelector(".shop-screen");const categories=root?.querySelector(".shop-categories");if(!categories)return;const acc=[...categories.querySelectorAll(".shop-accordion")];if(!acc.length)return;const tabs=document.createElement("div");tabs.className="shop-tabs";const content=document.createElement("div");content.className="shop-shop-content";acc.forEach((a,i)=>{const head=a.querySelector(".shop-accordion-head");const body=a.querySelector(".shop-accordion-body");if(!head||!body)return;const b=document.createElement("button");b.type="button";b.className="shop-tab"+(i===0?" active":"");b.textContent=head.querySelector("span")?.textContent||head.textContent;b.onclick=()=>{tabs.querySelectorAll(".shop-tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");content.innerHTML="";body.classList.remove("hidden");content.appendChild(body)};tabs.appendChild(b)});categories.innerHTML="";categories.appendChild(tabs);categories.appendChild(content);if(acc[0]){const first=acc[0].querySelector(".shop-accordion-body");if(first)content.appendChild(first)}const taskBox=[...root.children].find(x=>x.classList.contains("shop-accordion"));if(taskBox)root.insertBefore(categories,taskBox)}function toggleShopSection(id,button){const body=document.getElementById(id);if(!body)return;const willOpen=body.classList.contains("hidden");body.classList.toggle("hidden",!willOpen);if(button)button.setAttribute("aria-expanded",willOpen?"true":"false");const arrow=document.getElementById("arrow-"+id);if(arrow)arrow.textContent=willOpen?"⌃":"⌄";}async function buyShopItem(id){try{const d=await api("/api/shop/buy",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id})});if(d.item?.type==="title")showTitleUnlock({name:d.item.name,start:d.item.start,end:d.item.end,description:"Титул куплен в магазине."});await loadShop()}catch(e){alert(e.message)}}
async function equipShopItem(id){const fromAppearance=!!document.getElementById("appearancePreview");try{await api("/api/shop/equip",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id})});const shop=await api("/api/shop");const item=shop.items.find(x=>x.id===id);const eq=shop.equipped||{};settings.shopEquipped=eq;if(item?.type==="color"){if(eq.color===item.id)settings.accent=item.value;else settings.accent="#1688ff";}localStorage.sgSettings=JSON.stringify(settings);applySettings();if(fromAppearance)await chatAppearance();else await loadShop()}catch(e){alert(e.message)}}

let transferSearchTimer=null;
async function searchTransferUsers(q){
 clearTimeout(transferSearchTimer);
 const box=document.getElementById("transferUserResults");
 if(!box)return;
 const query=String(q||"").trim();
 if(!query){box.innerHTML="";return}
 transferSearchTimer=setTimeout(async()=>{
  try{
   const users=await api("/api/users?q="+encodeURIComponent(query));
   box.innerHTML=users.map(x=>`<button type="button" class="profile-action" style="width:100%;text-align:left;margin-top:6px" data-id="${esc(String(x.id))}" data-name="${esc(x.name||x.username||"Пользователь")}" data-username="${esc(x.username||"")}" onclick="chooseTransferUser(this.dataset.id,this.dataset.name,this.dataset.username)">${esc(x.name||x.username||"Пользователь")} <span style="color:var(--muted)">@${esc(x.username||"")}</span></button>`).join("")||'<div class=notice>Пользователь не найден</div>';
  }catch(e){box.innerHTML='<div class=notice>Ошибка поиска</div>'}
 },250);
}
function chooseTransferUser(id,name,username){
 const idEl=document.getElementById("transferUserId"),search=document.getElementById("transferUserSearch"),box=document.getElementById("transferUserResults");
 if(idEl)idEl.value=id;
 if(search)search.value=name+(username?" @"+username:"");
 if(box)box.innerHTML='<div class=notice>Получатель: <b>'+esc(name)+'</b>'+(username?' @'+esc(username):'')+'</div>';
}
async function sendCurrencyTransfer(){
 const userId=document.getElementById("transferUserId")?.value||"";
 const amount=Math.floor(Number(document.getElementById("transferAmount")?.value||0));
 if(!userId)return alert("Выберите получателя");
 if(!Number.isFinite(amount)||amount<=0)return alert("Введите положительное количество SP");
 if(!confirm("Перевести "+amount+" SP выбранному пользователю?"))return;
 try{
  const d=await api("/api/currency/transfer",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({userId,amount})});
  alert("💸 Переведено "+d.amount+" SP");
  loadCurrencyTransfer();
 }catch(e){alert(e.message)}
}

  const w=760,h=300,p=42,iw=w-p*2,ih=h-p*2,max=Math.max(1,...rows.map(x=>Number(x.count)||0));

  const line=pts.length?' <polyline points="'+pts.map(x=>x.join(',')).join(' ')+'" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>':'';
  const dots=pts.map((x,i)=>'<circle cx="'+x[0].toFixed(1)+'" cy="'+x[1].toFixed(1)+'" r="4" fill="var(--accent)"><title>'+esc(rows[i].label)+': '+(Number(rows[i].count)||0)+'</title></circle>').join('');
  const labels=rows.map((x,i)=>i%Math.max(1,Math.ceil(rows.length/7))===0||i===rows.length-1?'<text x="'+pts[i][0].toFixed(1)+'" y="'+(h-10)+'" text-anchor="middle" fill="var(--muted)" font-size="11">'+esc(x.label)+'</text>':'').join('');
  const grid=[0,.25,.5,.75,1].map(v=>{const y=h-p-v*ih;return '<line x1="'+p+'" y1="'+y+'" x2="'+(w-p)+'" y2="'+y+'" stroke="var(--line)" opacity=".7"/><text x="8" y="'+(y+4)+'" fill="var(--muted)" font-size="10">'+Math.round(max*v)+'</text>'}).join('');
  return '<div style="overflow:hidden;width:100%"><svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:auto;display:block">'+grid+line+dots+labels+'</svg></div>';
}
async function loadStats(tab='overview',period='30'){
  stopStatsRefresh();
  try{
    const s=await api("/api/stats?period="+encodeURIComponent(period));
    const periods=[['all','Все время'],['360','360 дней'],['30','30 дней'],['7','7 дней']];
    const periodButtons=periods.map(x=>'<button class="chip '+(x[0]===period?'active':'')+'" onclick="loadStats(\'registrations\',\''+x[0]+'\')" style="flex:1;min-width:75px">'+x[1]+'</button>').join('');
    app.innerHTML='<div class="top"><button class="icon" onclick="profile()">‹</button><div class="brand">Статистика</div><span></span></div><div class="profile"><div class="section" style="display:flex;gap:8px;padding:8px"><button class="chip '+(tab==='overview'?'active':'')+'" onclick="loadStats(\'overview\',\''+period+'\')" style="flex:1">Общая</button><button class="chip '+(tab==='registrations'?'active':'')+'" onclick="loadStats(\'registrations\',\''+period+'\')" style="flex:1">Регистрации</button></div><div id="statsContent"></div></div>';
    const box=document.getElementById('statsContent');
    if(tab==='registrations'){
      const data=s.registrations||[], total=data.reduce((a,x)=>a+(Number(x.count)||0),0), avg=data.length?total/data.length:0, peak=data.reduce((a,x)=>Number(x.count)>Number(a.count)?x:a,{label:'—',count:0});
      box.innerHTML='<div class="section" style="padding-top:4px"><h3>АУДИТОРИЯ</h3><div style="font-size:34px;font-weight:800;margin:2px 0 4px">'+s.users+'</div><div style="color:var(--muted);font-size:13px">Всего пользователей</div></div><div class="section"><h3>РОСТ ПОЛЬЗОВАТЕЛЕЙ</h3><div style="display:flex;gap:8px;overflow-x:auto;padding:4px 0 14px">'+periodButtons+'</div><div class="profile-card" style="padding:12px 6px 6px">'+registrationChart(data)+'</div><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px"><div class="profile-card" style="padding:14px"><div style="color:var(--muted);font-size:12px">Новых за период</div><b style="font-size:22px">'+total+'</b></div><div class="profile-card" style="padding:14px"><div style="color:var(--muted);font-size:12px">В среднем в день</div><b style="font-size:22px">'+(avg%1?avg.toFixed(1):avg)+'</b></div><div class="profile-card" style="padding:14px"><div style="color:var(--muted);font-size:12px">Лучший день</div><b style="font-size:18px">'+esc(peak.label)+'</b></div><div class="profile-card" style="padding:14px"><div style="color:var(--muted);font-size:12px">За лучший день</div><b style="font-size:22px">'+(Number(peak.count)||0)+'</b></div></div><div style="margin-top:12px;color:var(--muted);font-size:12px">Данные обновляются автоматически каждые 10 секунд.</div></div>';
    }else{
      box.innerHTML='<div class="section" style="padding-top:4px"><h3>ОБЗОР КАНАЛА</h3><div class="profile-card" style="padding:18px;margin-bottom:10px"><div style="font-size:38px;font-weight:800;color:var(--accent)">'+s.users+'</div><div style="color:var(--muted);font-size:13px">Пользователи</div></div><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px"><div class="profile-card" style="padding:14px"><div style="color:var(--muted);font-size:12px">Сейчас онлайн</div><b style="font-size:22px">'+(s.online||0)+'</b></div><div class="profile-card" style="padding:14px"><div style="color:var(--muted);font-size:12px">Сообщения</div><b style="font-size:22px">'+s.messages+'</b></div><div class="profile-card" style="padding:14px"><div style="color:var(--muted);font-size:12px">Группы</div><b style="font-size:22px">'+s.groups+'</b></div><div class="profile-card" style="padding:14px"><div style="color:var(--muted);font-size:12px">Регистрации</div><b style="font-size:22px">'+(s.registrations||[]).reduce((a,x)=>a+(Number(x.count)||0),0)+'</b><div style="color:var(--muted);font-size:11px">за выбранный период</div></div></div></div>';
    }
    statsRefreshTimer=setInterval(()=>loadStats(tab,period),10000);
  }catch(e){stopStatsRefresh();alert("Не удалось загрузить статистику: "+e.message)}
}
