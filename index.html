window.addEventListener("error",e=>{if(document.getElementById("app")&&!document.getElementById("app").innerHTML.trim())document.getElementById("app").innerHTML="<div class=empty>Ошибка загрузки SpiderGram. Обнови страницу.</div>"});window.addEventListener("unhandledrejection",e=>{console.error(e.reason)});const app=document.getElementById("app");function syncViewport(){if(!window.visualViewport)return;document.documentElement.style.setProperty("--vvh",window.visualViewport.height+"px");app.style.height=window.visualViewport.height+"px";app.style.minHeight=window.visualViewport.height+"px";window.scrollTo(0,0)}if(window.visualViewport){window.visualViewport.addEventListener("resize",syncViewport);window.visualViewport.addEventListener("scroll",()=>window.scrollTo(0,0));setTimeout(syncViewport,0)}let currentGroup=null;let token=localStorage.getItem("sgToken")||null,user=null,base=location.origin,sock,peer,typingTimer,recording=false,recorder,chunks=[];
function safeJSON(key,fallback){try{const raw=localStorage.getItem(key);return raw?JSON.parse(raw):fallback}catch(e){localStorage.removeItem(key);return fallback}}
user=safeJSON("sgUser",null);
const settings=safeJSON("sgSettings",{});
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
function applySettings(){const theme=settings.theme||"light";document.body.classList.toggle("dark",theme==="dark");document.documentElement.style.setProperty("--accent",settings.accent||"#1688ff");if(settings.bg){document.documentElement.style.setProperty("--messages","url(${settings.bg})")}}
applySettings();
async function api(path,opt={}){opt.headers={...(opt.headers||{}),...(token?{Authorization:"Bearer "+token}:{})};let r=await fetch(base+path,opt),d=await r.json().catch(()=>({}));if(r.status===401){localStorage.removeItem("sgToken");localStorage.removeItem("sgUser");token=null;user=null;if(sock)sock.disconnect();login();throw Error("Сессия истекла. Войдите в аккаунт заново")}if(!r.ok)throw Error(d.error||"Ошибка");return d}
function avatar(u,big=false){const n=esc((u?.name||u?.username||"?")[0].toUpperCase());return u?.avatar?'<img src="'+esc(u.avatar)+'" alt="">':n}
function login(){app.innerHTML=`<div class=login><h1>Spider<span class=blue>Gram</span></h1><p>Простой мессенджер для общения</p><input id=un class=field placeholder="Имя пользователя"><input id=pw class=field type=password placeholder="Пароль"><button class=primary onclick=doLogin()>Войти</button><button class=ghost onclick=register()>Создать аккаунт</button></div>`}
async function doLogin(){try{let d=await api("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:document.getElementById("un").value,password:document.getElementById("pw").value})});saveSession(d);home()}catch(e){alert(e.message)}}
function register(){app.innerHTML=`<div class=login><h1>Создать аккаунт</h1><p>Имя будет видно другим пользователям</p><input id=rn class=field placeholder="Имя"><input id=ru class=field placeholder="username"><div class=passwrap><input id=rp class=field type=password placeholder="Пароль (6+)"><button class=pass-toggle type=button onclick=togglePassword("rp",this)>◉</button></div><button class=primary onclick=doRegister()>Создать</button><button class=ghost onclick=login()>Назад</button></div>`}
async function togglePassword(id,btn){const x=document.getElementById(id);if(!x)return;x.type=x.type==="password"?"text":"password";btn.textContent=x.type==="password"?"◉":"●"}

function connect(){if(typeof io!=="function"){console.warn("Socket.IO не загрузился");return}if(sock)sock.disconnect();sock=io(base,{auth:{token}});sock.on("message",m=>{if(peer&&m.from===peer.id){addMessage(m);markRead()}else{loadChats();notifyIncoming(m)}});sock.on("presence",p=>{if(peer&&p.userId===peer.id){peer.online=p.online;peer.lastSeen=p.lastSeen;updateStatus()}});sock.on("group:message",m=>{if(peer&&peer.groupId===m.groupId)addMessage(m);else loadChats();loadGroups()});sock.on("message:update",m=>{if(document.getElementById("msg-"+m.id))replaceMessage(m);else if(peer&&m.from===peer.id)addMessage(m);loadChats()});sock.on("reaction",m=>{const el=document.getElementById("msg-"+m.messageId);if(el){const x=el.querySelector(".reactions");const html=m.reactions?.length?`<div class=reactions>${m.reactions.map(r=>`<span class=reaction>${esc(r.emoji)}</span>`).join("")}</div>`:"";if(x)x.outerHTML=html;else if(html)el.insertAdjacentHTML("beforeend",html)}});sock.on("typing",p=>{if(peer&&p.from===peer.id){document.getElementById("status").textContent=p.typing?"печатает…":(peer.online?"онлайн":"не в сети");document.getElementById("status").classList.toggle("typing",!!p.typing)}});sock.on("call:notify",n=>notifyCall(n));setupPush(false);loadCallNotifications()}

tification("SpiderGram",{body:name+" хочет с вами поговорить",tag:"call",data:{url:"/"}})}catch{}}}

function messageHtml(m){if(m.deleted||m.type==="deleted")return "";let body=m.type==="image"?`<img onclick="event.stopPropagation()" src="${esc(m.mediaUrl)}" alt="Фото">`:m.type==="audio"?`<audio onclick="event.stopPropagation()" controls src="${esc(m.mediaUrl)}"></audio>`:esc(m.text);return `<div id="msg-${m.id}" class="bubble ${m.from===user.id?"me":""}" data-msg-id="${esc(m.id)}" data-msg-text="${esc(m.text||"")}" onclick="messageActions(event,this.dataset.msgId,this.dataset.msgText,this.classList.contains('me'))">${body}${m.edited&&!m.deleted?" <small>(изменено)</small>":""}<div class=meta>${new Date(m.createdAt).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})}</div>${m.reactions?.length?`<div class=reactions>${m.reactions.map(r=>`<span class=reaction>${esc(r.emoji)}</span>`).join("")}</div>`:""}</div>`}

function messageActions(e,id,old,mine){e.stopPropagation();closeMessageMenu();const menu=document.createElement("div");menu.id="messageMenu";menu.className="message-menu";const row=document.createElement("div");row.className="reaction-row";["❤️","👍","😂","😮","😢","🔥"].forEach(emoji=>{const b=document.createElement("button");b.type="button";b.textContent=emoji;b.onclick=()=>reactMessage(id,emoji);row.appendChild(b)});menu.appendChild(row);const add=(label,fn,cls)=>{const b=document.createElement("button");b.type="button";b.textContent=label;if(cls)b.className=cls;b.onclick=fn;menu.appendChild(b)};add("📌  Закрепить / открепить",()=>pinMessage(id));if(mine){add("✏️  Изменить",()=>editMessage(id,old));add("🗑️  Удалить",()=>deleteMessage(id),"danger")}document.body.appendChild(menu);const bubble=e.target.closest(".bubble[data-msg-id]");const r=bubble?.getBoundingClientRect?.()||{left:20,top:100,bottom:100};const left=Math.min(Math.max(8,r.left),window.innerWidth-menu.offsetWidth-8);const top=Math.min(r.bottom+5,window.innerHeight-menu.offsetHeight-8);menu.style.left=left+"px";menu.style.top=Math.max(8,top)+"px";setTimeout(()=>document.addEventListener("click",closeMessageMenu,{once:true}),0)}

function chatDateKey(d){const x=new Date(d),y=new Date();return x.getFullYear()+"_"+x.getMonth()+"_"+x.getDate()}function chatDateLabel(d){const x=new Date(d),y=new Date();const today=new Date(y.getFullYear(),y.getMonth(),y.getDate()),day=new Date(x.getFullYear(),x.getMonth(),x.getDate()),diff=Math.round((today-day)/86400000);if(diff===0)return"Сегодня";if(diff===1)return"Вчера";const sameYear=x.getFullYear()===y.getFullYear();return x.toLocaleDateString("ru-RU",sameYear?{day:"numeric",month:"long"}:{day:"numeric",month:"long",year:"numeric"})}function addMessage(m){const box=document.getElementById("messages");if(!box||m.deleted||m.type==="deleted")return;const html=messageHtml(m);if(!html)return;const key=chatDateKey(m.createdAt),lastKey=box.dataset.lastDateKey||"";if(lastKey!==key){box.insertAdjacentHTML("beforeend",'<div class="chat-date-separator" data-date-key="'+esc(key)+'"><span>'+esc(chatDateLabel(m.createdAt))+"</span></div>");box.dataset.lastDateKey=key}box.insertAdjacentHTML("beforeend",html);box.scrollTop=box.scrollHeight}

async function sendPhotos(e){const files=[...(e.target.files||[])];e.target.value="";if(!files.length||(!peer&&!currentGroup))return;for(const f of files){if(!f.type.startsWith("image/"))continue;if(f.size>4*1024*1024){alert("Фото должно быть меньше 4 МБ: "+f.name);continue}await new Promise(resolve=>{const r=new FileReader();r.onload=async()=>{try{const path=currentGroup?"/api/groups/"+currentGroup.id+"/messages":"/api/messages/"+peer.id;const m=await api(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({type:"image",mediaUrl:r.result})});addMessage(m)}catch(x){alert(x.message)}finally{resolve()}};r.readAsDataURL(f)})}}async function toggleRecord(){const button=document.getElementById("mic")||document.getElementById("groupMic");if(recording){recorder.stop();recording=false;if(button){button.classList.remove("recording");button.innerHTML='<span class="mic-icon">🎙️</span>'}return}if(!navigator.mediaDevices?.getUserMedia)return alert("Запись голоса не поддерживается этим браузером");try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{stream.getTracks().forEach(t=>t.stop());const blob=new Blob(chunks,{type:recorder.mimeType||"audio/webm"});if(blob.size>5*1024*1024)return alert("Голосовое слишком большое");showVoicePreview(blob)};recorder.start();recording=true;if(button){button.classList.add("recording");button.innerHTML='<span class="mic-icon">⏹</span>'}}catch(e){alert("Разреши доступ к микрофону в настройках SpiderGram")}}function showVoicePreview(blob){document.getElementById("voicePreview")?.remove();const composer=document.querySelector(".composer");if(!composer)return;const url=URL.createObjectURL(blob);composer.insertAdjacentHTML("beforebegin",'<div class="voice-preview" id="voicePreview"><audio controls src="'+url+'"></audio><button onclick="cancelVoice()">✕</button><button class="voice-send" onclick="sendVoice()">➤</button></div>');window.pendingVoice={blob,url}}function cancelVoice(){if(window.pendingVoice){URL.revokeObjectURL(window.pendingVoice.url);window.pendingVoice=null}document.getElementById("voicePreview")?.remove()}async function sendVoice(){if(!window.pendingVoice)return;const blob=window.pendingVoice.blob;const r=new FileReader();r.onload=async()=>{try{const path=currentGroup?"/api/groups/"+currentGroup.id+"/messages":"/api/messages/"+peer.id;const m=await api(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({type:"audio",mediaUrl:r.result})});cancelVoice();addMessage(m)}catch(e){alert(e.message)}};r.readAsDataURL(blob)}async function requestNotify(){await setupPush(true)}
async function setupPush(requestPermission=false){
  try{
    if(!("serviceWorker"in navigator)||!("PushManager"in window)||!("Notification"in window))return false;

    if(requestPermission&&Notification.permission==="default")await Notification.requestPermission();

    const reg=await navigator.serviceWorker.register("/sw.js",{scope:"/"});
    const keyData=await api("/api/push/public-key");
    if(!keyData.publicKey)return false;
    let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:pushKeyToBytes(keyData.publicKey)});
    await api("/api/push/subscribe",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({subscription:sub.toJSON()})});

  }catch(e){console.warn("Push setup failed:",e?.message||e);return false}
}

function setBackground(e){const f=e.target.files[0];if(!f)return;if(f.size>3*1024*1024)return alert("Фон должен быть меньше 3 МБ");const r=new FileReader();r.onload=()=>{settings.bg=r.result;localStorage.sgSettings=JSON.stringify(settings);applySettings();profile()};r.readAsDataURL(f)}
function clearBackground(){delete settings.bg;localStorage.sgSettings=JSON.stringify(settings);applySettings();profile()}
function logout(){localStorage.removeItem("sgToken");localStorage.removeItem("sgUser");token=null;user=null;if(sock)sock.disconnect();login()}
document.addEventListener("click",e=>{if(e.target.closest("#settingsBtn"))profile()});
setTimeout(()=>{const boot=document.querySelector("#app .login p");if(boot&&boot.textContent==="Загрузка…"){console.warn("SpiderGram: startup fallback");login()}},2500);
token&&user?(connect(),home()):login();

async function adminPanel(){try{const a=await api('/api/admin/users');app.innerHTML='<div class="top"><button class="icon" onclick="profile()">‹</button><div class="brand">🛠️ Админ панель</div><span></span></div><div class="profile"><div class="section"><h3>УПРАВЛЕНИЕ</h3><button class="profile-action" onclick="adminRefreshUsers()">Обновить список <span style="float:right">↻</span></button><button class="profile-action" onclick="loadStats()">Статистика <span style="float:right">›</span></button></div><div class="section"><h3>ПОЛЬЗОВАТЕЛИ <span style="float:right;color:var(--muted);font-size:12px">'+a.length+'</span></h3><button id="adminToggle" class="profile-action" onclick="toggleAdminUsers()">Скрыть список пользователей <span style="float:right">⌃</span></button><div id="adminUserList">'+adminUsersHtml(a)+'</div></div><div class="section"><h3>ПОИСК</h3><input id="adminSearch" class="field" placeholder="@username или имя" autocomplete="off" oninput="adminSearchUsers()"><div id="adminSearchUsers"></div></div></div>'}catch(e){alert("Не удалось открыть центр управления: "+e.message)}}async function adminRefreshUsers(){await adminPanel()}function toggleAdminUsers(){const box=document.getElementById("adminUserList"),btn=document.getElementById("adminToggle");if(!box)return;const hidden=box.style.display==="none";box.style.display=hidden?"":"none";if(btn)btn.innerHTML=hidden?'Скрыть список пользователей <span style="float:right">⌃</span>':'Показать список пользователей <span style="float:right">⌄</span>'}
function adminUsersHtml(a){return a.length?a.map(x=>'<div class="profile-card" style="text-align:left"><div style="display:flex;align-items:center;gap:10px;margin-bottom:10px"><button class="avatar" style="border:0;padding:0;cursor:pointer" onclick="showUserProfile('+JSON.stringify(x.username)+',true)">'+avatar(x)+'</button><div style="flex:1"><b>'+esc(x.name)+'</b>'+verifiedCheckHtml(x)+'<div class="preview">@'+esc(x.username)+'</div>'+visibleTitleHtml(x)+'</div></div><div style="font-size:13px;color:var(--muted);margin-bottom:6px">Выдать титул</div><input id="at-'+x.id+'" class="field" placeholder="Например: Creator" value="'+esc(x.customTitle||'')+'"><button class="primary" onclick="adminSetTitle(\''+x.id+'\')">Сохранить титул</button>'+(x.customTitle?'<button class="profile-action" onclick="adminClearTitle(\''+x.id+'\')">Удалить титул</button>':'')+'<button class="profile-action" style="color:#1aa34a" onclick="adminSetCheck(\''+x.id+'\',true)">✓ Выдать зелёную галочку</button>'+(x.adminCheck?'<button class="profile-action" style="color:#ff4d4d" onclick="adminSetCheck(\''+x.id+'\',false)">✕ Снять зелёную галочку</button>':'')+'</div>').join(''):'<div class="empty">Пользователей нет</div>';}
let adminTimer;async function adminSearchUsers(){clearTimeout(adminTimer);adminTimer=setTimeout(async()=>{try{const q=document.getElementById('adminSearch')?.value.trim().replace(/^@/,'')||'';const box=document.getElementById('adminSearchUsers');if(!q){box.innerHTML="";return}const a=await api('/api/admin/users?q='+encodeURIComponent(q));box.innerHTML=adminUsersHtml(a)}catch(e){alert(e.message)}},250)}
async function adminSetTitle(id){try{const input=document.getElementById("at-"+id);const title=input?.value.trim()||"";const u=await api("/api/admin/users/"+encodeURIComponent(id)+"/title",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({title})});alert(title?"Титул выдан":"Титул снят");await adminPanel()}catch(e){alert("Не удалось изменить титул: "+e.message)}}
async function adminClearTitle(id){try{await api("/api/admin/users/"+encodeURIComponent(id)+"/title",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({title:""})});await adminPanel()}catch(e){alert("Не удалось удалить титул: "+e.message)}}
async function adminSetCheck(id,enabled){try{await api("/api/admin/users/"+encodeURIComponent(id)+"/check",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({enabled})});alert(enabled?"Галочка выдана":"Галочка снята");await adminPanel()}catch(e){alert("Не удалось изменить галочку: "+e.message)}}
async function loadStats(){try{const s=await api("/api/stats");app.innerHTML=`<div class=top><button class=icon onclick=profile()>‹</button><div class=brand>Статистика</div><span></span></div><div class=profile><div class=profile-card style="text-align:center"><div style="font-size:52px;font-weight:800;color:var(--accent);line-height:1.1">${s.users}</div><div style="color:var(--muted);margin-top:6px">Зарегистрированных пользователей</div></div><div class=section><h3>СТАТИСТИКА</h3><div class=setting><span>👤 Пользователи</span><b>${s.users}</b></div><div class=setting><span>🟢 Сейчас в сети</span><b>${s.online||0}</b></div><div class=setting><span>💬 Сообщения</span><b>${s.messages}</b></div><div class=setting><span>👥 Группы</span><b>${s.groups}</b></div></div><div style="margin-top:28px;text-align:center;color:var(--muted);font-size:13px">Всего зарегистрировалось: <b style="color:var(--text)">${s.users}</b> ${s.users===1?"человек":s.users<5?"человека":"человек"}</div></div>`}catch(e){alert("Не удалось загрузить статистику: "+e.message)}}


async function saveProfile(){let me=await api("/api/me",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:document.getElementById("pn").value})});user=me;localStorage.sgUser=JSON.stringify(me);alert("Профиль сохранён");home()}
async function changeAvatar(e){const f=e.target.files[0];if(!f)return;if(f.size>2*1024*1024)return alert("Аватар должен быть меньше 2 МБ");const r=new FileReader();r.onload=async()=>{try{if(!token)throw Error("Сессия истекла. Войди в аккаунт заново");let me=await api("/api/me",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({avatar:r.result})});user=me;localStorage.sgUser=JSON.stringify(me);if(document.getElementById("bigav"))document.getElementById("bigav").innerHTML=avatar(me);alert("Аватар изменён")}catch(x){alert("Не удалось изменить аватар: "+x.message)}};r.readAsDataURL(f)}
function setTheme(v){settings.theme=v;localStorage.sgSettings=JSON.stringify(settings);applySettings();profile()}
function setAccent(v){settings.accent=v;localStorage.sgSettings=JSON.stringify(settings);applySettings();profile()}

function clearBackground(){delete settings.bg;localStorage.sgSettings=JSON.stringify(settings);applySettings();profile()}
function logout(){localStorage.removeItem("sgToken");localStorage.removeItem("sgUser");token=null;user=null;if(sock)sock.disconnect();login()}
document.addEventListener("click",e=>{if(e.target.closest("#settingsBtn"))profile()});token&&user?(connect(),home()):login();
</script></body></html>
