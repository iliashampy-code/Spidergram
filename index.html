<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SpiderGram</title>
<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef1f5;color:#18212b;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input{font:inherit}.app{width:100%;max-width:620px;height:100dvh;margin:auto;background:#fff;display:flex;flex-direction:column;overflow:hidden}
.top{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #e9edf1}.brand{font-size:21px;font-weight:800}.blue{color:#1688ff}
.icon{border:0;background:transparent;font-size:22px;padding:8px}.content{flex:1;overflow:auto}.screen{padding:14px 16px}.search{background:#f0f3f6;border:0;border-radius:14px;padding:12px 15px;width:100%;outline:none}
.chat{display:flex;align-items:center;gap:12px;padding:12px 3px;border-bottom:1px solid #f0f1f3;cursor:pointer}.avatar{width:48px;height:48px;border-radius:50%;background:#1688ff;color:#fff;display:grid;place-items:center;font-weight:800;flex:none}.chattext{flex:1;min-width:0}.chatname{font-weight:700}.preview{color:#7d8791;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.time{font-size:12px;color:#89939d}
.login{padding:30px 24px}.login h1{text-align:center;margin:20px 0 8px}.login p{text-align:center;color:#7b858e}.field{width:100%;padding:14px;margin:6px 0;border:1px solid #dce2e7;border-radius:13px;outline:none}.primary{width:100%;padding:14px;margin:8px 0;border:0;border-radius:13px;background:#1688ff;color:#fff;font-weight:700}.ghost{width:100%;padding:13px;border:0;background:transparent;color:#1688ff}
.chathead{height:62px;display:flex;align-items:center;gap:10px;padding:7px 10px;border-bottom:1px solid #e9edf1}.chathead .avatar{width:42px;height:42px}.back{border:0;background:transparent;font-size:24px}.status{font-size:12px;color:#7c8791}.small{font-size:11px;color:#9aa3ab;font-weight:400}.typing{color:#1688ff}.messages{padding:14px 12px;overflow:auto;flex:1;background:#f6f8fa}.bubble{max-width:78%;padding:9px 12px;margin:5px 0;border-radius:15px;background:#fff;box-shadow:0 1px 2px #0000000d}.bubble.me{margin-left:auto;background:#1688ff;color:#fff}.bubble .meta{font-size:10px;opacity:.65;margin-top:3px}.composer{display:flex;gap:7px;padding:8px;border-top:1px solid #e6eaee}.composer input{flex:1;border:0;background:#f0f3f6;border-radius:20px;padding:11px 14px;outline:0}.send{border:0;background:#1688ff;color:#fff;border-radius:50%;width:42px}.empty{text-align:center;color:#89939d;padding:40px 15px}.profile{padding:24px;text-align:center}.bigavatar{width:88px;height:88px;margin:auto;border-radius:50%;background:#1688ff;color:#fff;display:grid;place-items:center;font-size:30px;font-weight:800}
</style></head><body><div class="app" id="app"></div>
<script>
const app=document.getElementById("app");let token=localStorage.sgToken,user=JSON.parse(localStorage.sgUser||"null"),base=location.origin,sock,peer,typingTimer;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
async function api(path,opt={}){opt.headers={...(opt.headers||{}),...(token?{Authorization:"Bearer "+token}:{})};let r=await fetch(base+path,opt),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Ошибка");return d}
function login(){app.innerHTML=`<div class=login><h1>🕷️ Spider<span class=blue>Gram</span></h1><p>Простой мессенджер для общения</p><input id=un class=field placeholder="Имя пользователя"><input id=pw class=field type=password placeholder="Пароль"><button class=primary onclick=doLogin()>Войти</button><button class=ghost onclick=register()>Создать аккаунт</button></div>`}
async function doLogin(){try{let d=await api("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:un.value,password:pw.value})});saveSession(d);home()}catch(e){alert(e.message)}}
function register(){app.innerHTML=`<div class=login><h1>Создать аккаунт</h1><p>Имя будет видно другим пользователям</p><input id=rn class=field placeholder="Имя"><input id=ru class=field placeholder="username"><input id=rp class=field type=password placeholder="Пароль (6+)"><button class=primary onclick=doRegister()>Создать</button><button class=ghost onclick=login()>Назад</button></div>`}
async function doRegister(){try{let d=await api("/api/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:rn.value,username:ru.value,password:rp.value})});saveSession(d);home()}catch(e){alert(e.message)}}
function saveSession(d){token=d.token;user=d.user;localStorage.sgToken=token;localStorage.sgUser=JSON.stringify(user);connect()}
function connect(){if(sock)sock.disconnect();sock=io(base,{auth:{token}});sock.on("message",m=>{if(peer&&m.from===peer.id){addMessage(m);markRead()}else{loadChats()}});sock.on("presence",p=>{if(peer&&p.userId===peer.id){peer.online=p.online;updateStatus()}})}
async function home(){peer=null;app.innerHTML=`<div class=top><div class=brand>🕷️ Spider<span class=blue>Gram</span></div><button class=icon onclick=profile()>☰</button></div><div class=screen><input id=search class=search placeholder="Поиск пользователя..." oninput=searchUsers()><div id=list></div></div>`;loadChats()}
async function loadChats(){let a=await api("/api/chats");renderChats(a)}
function renderChats(a){list.innerHTML=a.length?a.map(c=>`<div class=chat onclick='openChat(${JSON.stringify(c.user)})'><div class=avatar>${esc((c.user.name||c.user.username)[0].toUpperCase())}</div><div class=chattext><div class=chatname>${esc(c.user.name)} <span class=small>@${esc(c.user.username)}</span></div><div class=preview>${esc(c.last.text)}</div></div><div class=time>${new Date(c.last.createdAt).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})}</div></div>`).join(""):`<div class=empty>Нет чатов<br><br>Найди пользователя выше и начни общение</div>`}
let searchTimer;
async function searchUsers(){clearTimeout(searchTimer);searchTimer=setTimeout(async()=>{let q=search.value.trim();if(!q)return loadChats();let a=await api("/api/users?q="+encodeURIComponent(q));renderUsers(a)},250)}
function renderUsers(a){list.innerHTML=a.length?a.map(x=>`<div class=chat onclick='openChat(${JSON.stringify(x)})'><div class=avatar>${esc((x.name||x.username)[0].toUpperCase())}</div><div class=chattext><div class=chatname>${esc(x.name)}</div><div class=preview>@${esc(x.username)} ${x.online?"• онлайн":""}</div></div></div>`).join(""):`<div class=empty>Пользователь не найден</div>`}
async function openChat(x){peer=x;app.innerHTML=`<div class=chathead><button class=back onclick=home()>‹</button><div class=avatar>${esc((x.name||x.username)[0].toUpperCase())}</div><div><b>${esc(x.name)}</b><div id=status class=status></div></div></div><div id=messages class=messages></div><div class=composer><input id=msg placeholder="Сообщение..." oninput=notifyTyping() onkeydown='if(event.key==="Enter")send()'><button class=send onclick=send()>➤</button></div>`;updateStatus();let ms=await api("/api/messages/"+x.id);messages.innerHTML="";ms.forEach(addMessage);markRead()}
function updateStatus(){if(!peer)return;status.textContent=peer.online?"онлайн":peer.lastSeen?"был(а) недавно":"не в сети"}
function addMessage(m){if(document.getElementById("messages")){messages.insertAdjacentHTML("beforeend",`<div class="bubble ${m.from===user.id?"me":""}">${esc(m.text)}<div class=meta>${new Date(m.createdAt).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})}</div></div>`);messages.scrollTop=messages.scrollHeight}}
async function send(){let t=msg.value.trim();if(!t)return;let m=await api("/api/messages/"+peer.id,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:t})});msg.value="";addMessage(m)}
function markRead(){if(peer&&sock)sock.emit("read",{to:peer.id})}
function notifyTyping(){if(!peer||!sock)return;sock.emit('typing',{to:peer.id,typing:true});clearTimeout(typingTimer);typingTimer=setTimeout(()=>sock.emit('typing',{to:peer.id,typing:false}),900)}
async function profile(){let me=await api("/api/me");app.innerHTML=`<div class=top><button class=icon onclick=home()>‹</button><div class=brand>Профиль</div><span></span></div><div class=profile><div class=bigavatar>${esc((me.name||me.username)[0].toUpperCase())}</div><h2>${esc(me.name)}</h2><p>@${esc(me.username)}</p><input id=pn class=field value="${esc(me.name)}"><button class=primary onclick=saveProfile()>Сохранить</button><button class=ghost onclick=logout()>Выйти</button></div>`}
async function saveProfile(){let me=await api("/api/me",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:pn.value})});user=me;localStorage.sgUser=JSON.stringify(me);alert("Профиль сохранён");home()}
function logout(){localStorage.removeItem("sgToken");localStorage.removeItem("sgUser");token=null;user=null;if(sock)sock.disconnect();login()}
token&&user?(connect(),home()):login();
</script></body></html>
